name: Prepare Prism development integration
# Native input tests observe actual panel entry completion before measuring geometry.
on:
  push:
    branches: ['feature/prism-earning-001']
    paths: ['.github/workflows/prism-collection-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'karahaNx/Lumenfall' && github.ref == 'refs/heads/feature/prism-earning-001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge exact development snapshot into isolated candidate only
        run: |
          set -euo pipefail
          mkdir -p collection-preparation
          test "$(git ls-remote origin refs/heads/feature/progression-expansion-2026-10-09 | cut -f1)" = f145bf2c3d7762e6180d4b3369500f465ee607d6
          git fetch origin f145bf2c3d7762e6180d4b3369500f465ee607d6
          git -c user.name='Lumenfall validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-commit --no-ff f145bf2c3d7762e6180d4b3369500f465ee607d6
      - name: Reproduce initial collection price refresh defect in the actual browser
        run: node tests/behavioral/collection-price-ui.cjs index.html collection-preparation/baseline --expect-baseline-failure
      - name: Apply scoped price refresh and intended visibility regression corrections
        run: |
          set -euo pipefail
          node scripts/dev/collection-prepare.cjs | tee collection-preparation/patch.json
          git diff HEAD --check
          git diff HEAD --stat | tee collection-preparation/diff-stat.txt
          git diff HEAD > collection-preparation/candidate.patch
          node scripts/ci/validate_source.cjs
          node tests/behavioral/prism-earning.cjs | tee collection-preparation/numerical.json
          node tests/behavioral/prism-earning-state.cjs | tee collection-preparation/state.json
      - name: Validate live currency colors purchases and causal negative controls
        run: node tests/behavioral/collection-price-ui.cjs index.html collection-preparation/corrected --negative
      - name: Commit candidate without changing collection or main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/prism-earning-001 | cut -f1)" = "$GITHUB_SHA"
          git add -- index.html tests/behavioral/upgrade-identity.js tests/behavioral/tree-purchases.js
          git -c user.name='Lumenfall validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Combine Prism and development UI with tested live currency presentation'
          git push origin HEAD:refs/heads/feature/prism-earning-001
      - name: Preserve actual failure and corrected source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-preparation-${{ github.run_id }}
          retention-days: 14
          path: |
            collection-preparation/
            index.html
            tests/behavioral/collection-price-ui.cjs
            tests/behavioral/upgrade-identity.js
            tests/behavioral/tree-purchases.js
