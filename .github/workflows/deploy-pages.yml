# NOTE: GitHub Pages requires a public repo on the Free plan. This repo is
# currently private, so this workflow is manual-only (won't auto-run and
# fail on every push). Once the repo goes public, add back an `on: push:`
# trigger like the other workflows have, and re-enable Pages at
# Settings -> Pages -> Source -> GitHub Actions.
name: Deploy GitHub Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site content
        run: |
          mkdir -p public
          cp index.html manifest.webmanifest service-worker.js privacy.html public/
          cp -r icons public/icons
          cp -r fonts public/fonts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
