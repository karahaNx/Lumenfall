name: P2-03B PR bootstrap runner
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == '02/p2-03b-auto-ascend-rift-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02/p2-03b-auto-ascend-rift-integrity
          fetch-depth: 0
      - name: Apply P2-03B and remove bootstrap files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); s=p.read_text()
          pairs=[
          ("function progressionDepth(){\n  return state.riftMode==='farm' && state.farmReturnDepth ? state.farmReturnDepth : state.depth;\n}","function progressionDepth(){\n  return state.riftMode==='farm' && state.farmReturnDepth ? state.farmReturnDepth : state.depth;\n}\nfunction clearedProgressionRift(){\n  return Math.max(0,progressionDepth()-1);\n}\nfunction ascendEligible(){\n  return clearedProgressionRift()>=15;\n}"),
          ("var MIN_AUTO_ASCEND_RIFT = 16;\nfunction autoAscendTarget(){\n  return Math.max(MIN_AUTO_ASCEND_RIFT, Math.floor(state.autoAscendTargetDepth||MIN_AUTO_ASCEND_RIFT));\n}\nfunction autoAscendReady(){\n  return !!(state.riftMode!=='farm' && state.owned.autoascend && state.autoAscendEnabled && state.depth >= autoAscendTarget());\n}\nfunction updateAutoAscendTargetFromProgress(){\n  if(!state.owned.autoascend) return;\n  state.autoAscendTargetDepth = Math.max(autoAscendTarget(), state.maxDepthEver||1, progressionDepth()||1);\n}","var MIN_AUTO_ASCEND_RIFT = 16;\n// schema-v1 stores the legacy encounter threshold N, meaning clear N-1.\nfunction autoAscendTarget(){\n  return Math.max(MIN_AUTO_ASCEND_RIFT, Math.floor(state.autoAscendTargetDepth||MIN_AUTO_ASCEND_RIFT));\n}\nfunction autoAscendClearedTarget(){\n  return Math.max(15,autoAscendTarget()-1);\n}\nfunction autoAscendReady(){\n  return !!(state.riftMode!=='farm' && state.owned.autoascend && state.autoAscendEnabled && ascendEligible() && clearedProgressionRift()>=autoAscendClearedTarget());\n}\nfunction updateAutoAscendTargetFromProgress(){\n  if(!state.owned.autoascend) return;\n  state.autoAscendTargetDepth = Math.max(autoAscendTarget(), clearedProgressionRift()+1);\n}"),
          ("function doAscend(auto){\n  var cleared = progressionDepth() - 1;\n  if(cleared < 15) return;","function doAscend(auto){\n  var cleared = clearedProgressionRift();\n  if(!ascendEligible()) return;"),
          ("function renderAscendSummary(){\n  var cleared = progressionDepth() - 1;\n  var eligible = cleared >= 15;","function renderAscendSummary(){\n  var cleared = clearedProgressionRift();\n  var eligible = ascendEligible();"),
          ("Target: Rift '+autoAscendTarget()+' — turn OFF to push farther; your next manual Ascend at a new high raises this target.","Target: clear Rift '+autoAscendClearedTarget()+' — turn OFF to push farther; your next manual Ascend at a new high raises this target."),
          ("Unlock automatic Ascension at your saved Rift target. Toggle it on or off anytime; push farther with it off, then manually Ascend to raise the target.","Unlock automatic Ascension after your saved cleared-Rift target. Toggle it on or off anytime; push farther with it off, then manually Ascend to raise the target.")]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing index anchor')
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('tests/behavioral/run.py'); s=p.read_text()
          old='    "p2-ascend-integrity": "fresh",\n'; s=s.replace(old,old+'    "p2-03b-auto-ascend-integrity": "fresh",\n',1)
          old="  ascendBreakdown: function(depth){ return JSON.parse(JSON.stringify(ascendPrismBreakdown(depth))); },\n"; s=s.replace(old,old+"  ascendEligibility: function(){ return {eligible:ascendEligible(),cleared:clearedProgressionRift(),autoReady:autoAscendReady(),autoClearedTarget:autoAscendClearedTarget()}; },\n",1)
          marker="        case 'p2-wisp-progression-pacing': {"
          case=base64.b64decode('').decode()
          if marker not in s: raise SystemExit('missing test anchor')
          s=s.replace(marker,case+marker,1); p.write_text(s)
          Path('docs/audits/p2-03b-auto-ascend-rift-integrity.md').write_text('# P2-03B — Auto-Ascend cleared-Rift integrity\n\nRoot cause: Auto-Ascend compared the current encounter directly with its target, one Rift ahead of authoritative cleared progression. `clearedProgressionRift()` and `ascendEligible()` now define shared current-run eligibility for manual and automatic Ascension. The schema-v1 legacy target representation is translated without migration. Historical max depth cannot grant current-run eligibility. No balance formulas changed.\n')
          PY
          rm -f .github/workflows/p2-03b-bootstrap.yml .github/workflows/p2-03b-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P2-03B: enforce cleared-Rift Auto-Ascend integrity"
          git push origin HEAD:02/p2-03b-auto-ascend-rift-integrity
