name: Cleanup stale branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/android-only"
            "feature/rift-push-farm"
            "feature/smart-auto-ascend"
            "fix/android-apk-release"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              || true
          done
