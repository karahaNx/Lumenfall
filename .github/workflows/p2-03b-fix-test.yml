name: P2-03B focused test fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == '02/p2-03b-auto-ascend-rift-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02/p2-03b-auto-ascend-rift-integrity
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/behavioral/run.py'); s=p.read_text()
          old="var kill=cloneJson(base);kill.enemyHp=0;"
          new="var kill=cloneJson(base);kill.enemyHp=1;kill.spirits.ember=100;kill.heroResource.ember=100;"
          if old not in s: raise SystemExit('focused test anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/p2-03b-fix-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P2-03B: exercise target clear through authoritative combat"
          git push origin HEAD:02/p2-03b-auto-ascend-rift-integrity
