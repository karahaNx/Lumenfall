name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icons/**'
      - 'fonts/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Stage Android web assets
        working-directory: mobile
        run: |
          rm -rf www
          mkdir -p www/fonts
          cp ../index.html www/index.html
          cp -r ../fonts/. www/fonts/

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Stage Android icon sources
        working-directory: mobile
        run: |
          mkdir -p assets
          cp ../icons/icon-1024.png assets/icon.png
          cp ../icons/icon-maskable-1024.png assets/icon-foreground.png
          cp ../icons/icon-background-1024.png assets/icon-background.png
          cp ../icons/icon-1024.png assets/splash.png

      - name: Generate Android icons and splash
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Lumenfall.apk
          test -s Lumenfall.apk
          ls -lh Lumenfall.apk

      - name: Remove legacy Actions artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done

      - name: Remove legacy EXE and AAB release assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | .assets[] | select((.name | endswith(".exe")) or (.name | endswith(".aab"))) | .id' |
          while read -r asset_id; do
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin --force refs/tags/android-latest

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Lumenfall.apk --clobber
            gh release edit android-latest \
              --title "Lumenfall Android — Latest" \
              --notes "Automatically built from the latest main branch. Android APK only."
          else
            gh release create android-latest Lumenfall.apk \
              --title "Lumenfall Android — Latest" \
              --notes "Automatically built from the latest main branch. Android APK only."
          fi
