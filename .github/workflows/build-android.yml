name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icons/**'
      - 'fonts/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Stage Android web assets
        working-directory: mobile
        run: |
          rm -rf www
          mkdir -p www/fonts
          cp ../index.html www/index.html
          cp -r ../fonts/. www/fonts/

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Stage Android icon sources
        working-directory: mobile
        run: |
          mkdir -p assets
          cp ../icons/icon-1024.png assets/icon.png
          cp ../icons/icon-maskable-1024.png assets/icon-foreground.png
          cp ../icons/icon-background-1024.png assets/icon-background.png
          cp ../icons/icon-1024.png assets/splash.png

      - name: Generate Android icons and splash
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Lumenfall.apk
          test -s Lumenfall.apk
          ls -lh Lumenfall.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumenfall-Android-APK
          path: Lumenfall.apk
          if-no-files-found: error
          retention-days: 30
