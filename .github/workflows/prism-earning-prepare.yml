name: Prepare isolated Prism candidate

on:
  push:
    branches: ['feature/prism-earning-001']
    paths:
      - '.github/workflows/prism-earning-prepare.yml'
      - 'scripts/dev/prepare-prism-earning.cjs'
      - 'scripts/dev/prism-earning-engine.js'
      - 'tests/behavioral/prism-earning.cjs'

permissions:
  contents: write

concurrency:
  group: lumenfall-prism-earning-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'karahaNx/Lumenfall' && github.ref == 'refs/heads/feature/prism-earning-001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pinned Prism-only patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prism-validation
          node scripts/dev/prepare-prism-earning.cjs | tee prism-validation/preparation.json
          git diff --check
          git diff --stat | tee prism-validation/diff-stat.txt
          git diff > prism-validation/candidate.patch
      - name: Validate actual source and task context
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/validate_source.cjs | tee prism-validation/source.txt
          node scripts/codex/check_context.cjs --task docs/tasks/PRISM_EARNING_001.md | tee prism-validation/context.txt
      - name: Test exact candidate functions and causal defects
        shell: bash
        run: |
          set -euo pipefail
          node tests/behavioral/prism-earning.cjs --source index.html | tee prism-validation/numerical.json
      - name: Commit only to the isolated development branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/prism-earning-001'
          remote="$(git ls-remote origin refs/heads/feature/prism-earning-001 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          rm scripts/dev/prepare-prism-earning.cjs scripts/dev/prism-earning-engine.js .github/workflows/prism-earning-prepare.yml
          git add -- index.html AGENTS.md tests/behavioral/ascend-prisms.js tests/behavioral/run.cjs .github/workflows/pre-merge-validation.yml scripts/dev/prepare-prism-earning.cjs scripts/dev/prism-earning-engine.js .github/workflows/prism-earning-prepare.yml
          git diff --cached --check
          git -c user.name='Lumenfall development validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement protected Prism earnings and exact rounding with regression coverage'
          git push origin HEAD:refs/heads/feature/prism-earning-001
          git rev-parse HEAD | tee prism-validation/candidate-commit.txt
      - name: Preserve source-bound validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-earning-candidate-${{ github.run_id }}
          retention-days: 3
          path: |
            prism-validation/
            index.html
            tests/behavioral/
            scripts/ci/
            scripts/lib/
            scripts/serve.cjs
            fonts/
            branding/
