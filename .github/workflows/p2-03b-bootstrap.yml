name: P2-03B bootstrap
on:
  push:
    branches:
      - 02/p2-03b-auto-ascend-rift-integrity
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02/p2-03b-auto-ascend-rift-integrity
      - name: Apply scoped P2-03B patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements=[
          ("function progressionDepth(){\n  return state.riftMode==='farm' && state.farmReturnDepth ? state.farmReturnDepth : state.depth;\n}","function progressionDepth(){\n  return state.riftMode==='farm' && state.farmReturnDepth ? state.farmReturnDepth : state.depth;\n}\nfunction clearedProgressionRift(){\n  return Math.max(0,progressionDepth()-1);\n}\nfunction ascendEligible(){\n  return clearedProgressionRift()>=15;\n}"),
          ("var MIN_AUTO_ASCEND_RIFT = 16;\nfunction autoAscendTarget(){\n  return Math.max(MIN_AUTO_ASCEND_RIFT, Math.floor(state.autoAscendTargetDepth||MIN_AUTO_ASCEND_RIFT));\n}\nfunction autoAscendReady(){\n  return !!(state.riftMode!=='farm' && state.owned.autoascend && state.autoAscendEnabled && state.depth >= autoAscendTarget());\n}\nfunction updateAutoAscendTargetFromProgress(){\n  if(!state.owned.autoascend) return;\n  state.autoAscendTargetDepth = Math.max(autoAscendTarget(), state.maxDepthEver||1, progressionDepth()||1);\n}","var MIN_AUTO_ASCEND_RIFT = 16;\n// autoAscendTargetDepth is a schema-v1 legacy encounter threshold: N meant\n// 'Ascend after clearing N-1'. Keep that persisted representation stable, but\n// expose and compare the authoritative cleared-Rift target everywhere else.\nfunction autoAscendTarget(){\n  return Math.max(MIN_AUTO_ASCEND_RIFT, Math.floor(state.autoAscendTargetDepth||MIN_AUTO_ASCEND_RIFT));\n}\nfunction autoAscendClearedTarget(){\n  return Math.max(15,autoAscendTarget()-1);\n}\nfunction autoAscendReady(){\n  return !!(state.riftMode!=='farm' && state.owned.autoascend && state.autoAscendEnabled && ascendEligible() && clearedProgressionRift()>=autoAscendClearedTarget());\n}\nfunction updateAutoAscendTargetFromProgress(){\n  if(!state.owned.autoascend) return;\n  state.autoAscendTargetDepth = Math.max(autoAscendTarget(), clearedProgressionRift()+1);\n}"),
          ("function doAscend(auto){\n  var cleared = progressionDepth() - 1;\n  if(cleared < 15) return;","function doAscend(auto){\n  var cleared = clearedProgressionRift();\n  if(!ascendEligible()) return;"),
          ("function renderAscendSummary(){\n  var cleared = progressionDepth() - 1;\n  var eligible = cleared >= 15;","function renderAscendSummary(){\n  var cleared = clearedProgressionRift();\n  var eligible = ascendEligible();"),
          ("Target: Rift '+autoAscendTarget()+' — turn OFF to push farther; your next manual Ascend at a new high raises this target.","Target: clear Rift '+autoAscendClearedTarget()+' — turn OFF to push farther; your next manual Ascend at a new high raises this target."),
          ("Unlock automatic Ascension at your saved Rift target. Toggle it on or off anytime; push farther with it off, then manually Ascend to raise the target.","Unlock automatic Ascension after your saved cleared-Rift target. Toggle it on or off anytime; push farther with it off, then manually Ascend to raise the target.")]
          for old,new in replacements:
              if old not in s: raise SystemExit('missing index anchor: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('tests/behavioral/run.py'); s=p.read_text()
          old='    "p2-ascend-integrity": "fresh",\n'; s=s.replace(old,old+'    "p2-03b-auto-ascend-integrity": "fresh",\n',1)
          old="  ascendBreakdown: function(depth){ return JSON.parse(JSON.stringify(ascendPrismBreakdown(depth))); },\n"; s=s.replace(old,old+"  ascendEligibility: function(){ return {eligible:ascendEligible(),cleared:clearedProgressionRift(),autoReady:autoAscendReady(),autoClearedTarget:autoAscendClearedTarget()}; },\n",1)
          marker="        case 'p2-wisp-progression-pacing': {"
          case=r'''        case 'p2-03b-auto-ascend-integrity': {
          var base=bridge.freshStateSnapshot();base.owned.autoascend=true;base.autoAscendEnabled=true;base.autoAscendTargetDepth=21;base.depth=20;base.maxDepthEver=20;base.enemyDepth=20;base.enemyMaxHp=bridge.enemyHpFor(20);base.enemyHp=base.enemyMaxHp;
          bridge.setState(base);var boundary=bridge.ascendEligibility();assert(boundary.cleared===19 && boundary.autoClearedTarget===20,'target 21 must authoritatively mean clear Rift 20');assert(boundary.eligible===true && boundary.autoReady===false,'Auto cannot fire before saved target clear');
          var before=state();var zero=bridge.simulate(0,'offline',0,PARITY_CLOCK_MS);assert(zero.state.ascendCount===before.ascendCount,'arrival at target Boss must not Auto-Ascend');assert(zero.state.sigils===before.sigils,'unbeaten target Boss must not grant/consume Sigils');
          var kill=cloneJson(base);kill.enemyHp=0;bridge.setState(kill);var afterKill=bridge.simulateTimeline(0,'offline',PARITY_CLOCK_MS);assert(afterKill.state.ascendCount===kill.ascendCount+1,'clearing target Rift must produce exactly one Auto-Ascend');assert(afterKill.state.depth===1 && afterKill.summary.ascends===1,'one qualifying clear must reset once');assert(afterKill.state.sigils===kill.sigils+2,'target Boss Sigils must be awarded before reset');assert(bridge.ascendEligibility().autoReady===false,'post-reset cannot remain eligible');
          var stale=cloneJson(afterKill.state);stale.maxDepthEver=99;stale.depth=1;stale.enemyDepth=1;stale.enemyMaxHp=bridge.enemyHpFor(1);stale.enemyHp=stale.enemyMaxHp;bridge.setState(stale);assert(bridge.ascendEligibility().eligible===false && bridge.ascendEligibility().autoReady===false,'historical maxDepthEver must not prove current-run eligibility');bridge.save();bridge.setState(JSON.parse(bridge.rawSave()));assert(bridge.ascendEligibility().autoReady===false,'save/load must not recreate consumed eligibility');
          var farm=cloneJson(base);farm.depth=19;farm.riftMode='farm';farm.farmDepth=19;farm.farmReturnDepth=21;farm.enemyDepth=19;farm.enemyMaxHp=bridge.enemyHpFor(19);farm.enemyHp=farm.enemyMaxHp;bridge.setState(farm);var farmEligibility=bridge.ascendEligibility();assert(farmEligibility.cleared===20 && farmEligibility.eligible===true && farmEligibility.autoReady===false,'Farm cannot trigger Auto-Ascend');bridge.enterPush();assert(bridge.ascendEligibility().autoReady===true,'Push return may use legitimate cleared target');
          var parity=cloneJson(base);parity.depth=19;parity.maxDepthEver=20;parity.enemyDepth=19;parity.enemyMaxHp=bridge.enemyHpFor(19);parity.enemyHp=1;parity.spirits.ember=100;bridge.setState(parity);var direct=bridge.simulate(120,'offline',120,PARITY_CLOCK_MS);bridge.setState(parity);var chunked=bridge.simulate(120,'offline',1,PARITY_CLOCK_MS);assertProtectedParity(chunked.state,direct.state,'P2-03B direct/chunked parity');assert(chunked.summary.ascends===direct.summary.ascends,'chunking must not change Ascension count');bridge.setState(parity);var offlineDirect=bridge.simulateOfflineDirect(120,PARITY_CLOCK_MS);assertProtectedParity(offlineDirect.state,direct.state,'P2-03B offline/direct parity');
          var manual=cloneJson(base);manual.autoAscendEnabled=false;manual.depth=16;manual.maxDepthEver=16;manual.enemyDepth=16;manual.enemyMaxHp=bridge.enemyHpFor(16);manual.enemyHp=manual.enemyMaxHp;bridge.setState(manual);assert(bridge.ascendEligibility().eligible===true,'15 cleared Rifts must satisfy shared eligibility');var rewardBefore=bridge.ascendBreakdown(16).gain;var manualResult=bridge.ascendManual();assert(manualResult.gain===rewardBefore,'reward magnitude must not change');var ineligible=cloneJson(manual);ineligible.depth=15;ineligible.maxDepthEver=15;ineligible.enemyDepth=15;ineligible.enemyMaxHp=bridge.enemyHpFor(15);ineligible.enemyHp=ineligible.enemyMaxHp;ineligible.autoAscendEnabled=true;ineligible.autoAscendTargetDepth=16;bridge.setState(ineligible);assert(bridge.ascendEligibility().eligible===false && bridge.ascendEligibility().autoReady===false,'Auto cannot bypass shared manual eligibility');
          finish('pass',{targetClearedRift:20,bossRewardBeforeAscend:true,singleEvent:true,postResetSafe:true,saveLoadSafe:true,farmSafe:true,directChunkedAscends:direct.summary.ascends,manualReward:manualResult.gain});return;
        }

'''
          if marker not in s: raise SystemExit('missing case anchor')
          s=s.replace(marker,case+marker,1); p.write_text(s)
          Path('docs/audits/p2-03b-auto-ascend-rift-integrity.md').write_text('''# P2-03B — Auto-Ascend cleared-Rift integrity\n\n## Root cause\n\nAuto-Ascend compared the current encounter `state.depth` directly with the saved target. The current encounter is one Rift ahead of authoritative cleared progression, so reaching a target encounter could Ascend before that Rift was defeated, including before a target Boss paid its Sigils. Manual Ascend already reasoned from `progressionDepth() - 1`, leaving two eligibility interpretations.\n\n## Resolution\n\n`clearedProgressionRift()` is now the shared current-run cleared-Rift definition and `ascendEligible()` is the single fundamental Ascension eligibility rule. Manual Ascend, its presentation, and Auto-Ascend reuse it. Auto additionally requires Push mode, ownership/enabled state, and its saved target.\n\nThe existing schema-v1 `autoAscendTargetDepth` representation is retained for compatibility: historically N represented the encounter threshold reached after clearing N-1. `autoAscendClearedTarget()` translates that persisted value to the authoritative cleared-Rift target without a schema bump or destructive migration. Historical `maxDepthEver` never grants current-run eligibility.\n\nNo reward formula, difficulty, Wisp, Formation, Research, Study, Deed, Rarity/Module, Sigil/Comet, boss-retreat, or P2-01A benchmark rule changes.\n''')
          PY
          rm .github/workflows/p2-03b-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/behavioral/run.py docs/audits/p2-03b-auto-ascend-rift-integrity.md .github/workflows/p2-03b-bootstrap.yml
          git commit -m "P2-03B: enforce cleared-Rift Auto-Ascend integrity"
          git push origin HEAD:02/p2-03b-auto-ascend-rift-integrity
