name: Prepare tested Lab expansion
on:
  push:
    branches: ['feature/lab-expansion-001']
    paths: ['.github/workflows/lab-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and apply exact reviewed candidate
        run: |
          mkdir -p lab-preparation
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),z=require('node:zlib'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          let encoded=Array.from({length:5},(_,i)=>fs.readFileSync('scripts/dev/lab-payload-'+i+'.txt','utf8').trim()).join('');
          // Correct a known single-character transport transcription, then require the original payload digest.
          encoded=encoded.replace('ziocYfmxX','ziocfmxX');
          const raw=z.brotliDecompressSync(Buffer.from(encoded,'base64'));
          assert.equal(hash(raw),'b53e394f1b9dcab3bc10cbfd665c156dd961ff8173c752d11fd75a49c365a2b9');
          const p=JSON.parse(raw),allowed=['index.html','tests/behavioral/upgrade-identity.js','tests/behavioral/measured-inquiry.js','tests/behavioral/r3-destinations.js','tests/behavioral/lab-expansion-harness.cjs','tests/behavioral/lab-expansion.cjs','tests/behavioral/lab-expansion-ui.cjs','tests/behavioral/lab-expansion-legacy.cjs','docs/tasks/LAB_EXPANSION_001.md','docs/qa/lab-expansion-001/DESIGN.md'];
          assert.deepEqual(p.result.map(r=>r.path).sort(),allowed.slice().sort());
          for(const r of p.expected)assert.equal(hash(fs.readFileSync(r.path)),r.sha,'baseline '+r.path);
          fs.writeFileSync('/tmp/lab-candidate.patch',p.patch);
          cp.execFileSync('git',['apply','--unidiff-zero','--check','/tmp/lab-candidate.patch']);cp.execFileSync('git',['apply','--unidiff-zero','/tmp/lab-candidate.patch']);
          for(const f of p.files){assert(allowed.includes(f.path));assert(!fs.existsSync(f.path),'new path '+f.path);fs.mkdirSync(require('node:path').dirname(f.path),{recursive:true});fs.writeFileSync(f.path,f.content);}
          for(const r of p.result)assert.equal(hash(fs.readFileSync(r.path)),r.sha,'candidate '+r.path);
          fs.writeFileSync('lab-preparation/manifest.json',JSON.stringify({head:process.env.GITHUB_SHA,expected:p.expected,result:p.result},null,2));
          fs.writeFileSync('lab-preparation/candidate.patch',p.patch);fs.writeFileSync('/tmp/lab-result-paths',allowed.join('\n')+'\n');
          console.log(JSON.stringify({status:'verified',source:hash(fs.readFileSync('index.html')),files:allowed.length}));
          JS
          git diff --check
      - name: Source and numerical state acceptance
        run: |
          set -euo pipefail
          node scripts/ci/validate_source.cjs | tee lab-preparation/source.txt
          node scripts/codex/check_context.cjs --task docs/tasks/LAB_EXPANSION_001.md | tee lab-preparation/context.txt
          node tests/behavioral/lab-expansion.cjs index.html --negative | tee lab-preparation/lab-core.json
          node tests/behavioral/prism-earning.cjs --source index.html | tee lab-preparation/prism-numeric.json
          node tests/behavioral/prism-earning-state.cjs index.html | tee lab-preparation/prism-state.json
      - name: Commit validated product only to the isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/lab-expansion-001
          test "$(git ls-remote origin refs/heads/feature/lab-expansion-001 | cut -f1)" = "$GITHUB_SHA"
          xargs -d '\n' git add -- < /tmp/lab-result-paths
          git rm -- scripts/dev/lab-payload-0.txt scripts/dev/lab-payload-1.txt scripts/dev/lab-payload-2.txt scripts/dev/lab-payload-3.txt scripts/dev/lab-payload-4.txt
          git diff --cached --check
          git -c user.name='Lumenfall development validation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement twenty-project Research Lab with preserved paid work and regression coverage'
          git push origin HEAD:refs/heads/feature/lab-expansion-001
          git rev-parse HEAD | tee lab-preparation/product-commit.txt
      - name: Real browser Lab purchase and persistence acceptance
        run: node tests/behavioral/lab-expansion-ui.cjs index.html lab-preparation/mobile
      - name: Preserve candidate and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-preparation-${{ github.run_id }}
          retention-days: 14
          path: |
            lab-preparation/
            index.html
            tests/behavioral/lab-expansion*.cjs
            docs/tasks/LAB_EXPANSION_001.md
            docs/qa/lab-expansion-001/
