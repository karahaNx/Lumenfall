<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lumenfall Rift Crystal</title>
  <desc id="desc">A faceted luminous crystal wrapped by a golden rift orbit inside an open arc frame.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset=".22" stop-color="#ffc75b"/><stop offset=".55" stop-color="#d87b26"/><stop offset=".78" stop-color="#ffcf66"/><stop offset="1" stop-color="#fff2b8"/>
    </linearGradient>
    <linearGradient id="crystal" x1=".18" y1=".08" x2=".82" y2=".96">
      <stop offset="0" stop-color="#fff7d0"/><stop offset=".18" stop-color="#d9c8ff"/><stop offset=".46" stop-color="#8c78ff"/><stop offset=".72" stop-color="#6758d5"/><stop offset="1" stop-color="#e89b4b"/>
    </linearGradient>
    <linearGradient id="crystalShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e48a4"/><stop offset="1" stop-color="#1b1f57"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="52%" r="44%"><stop offset="0" stop-color="#fffbdc"/><stop offset=".18" stop-color="#ffc75b" stop-opacity=".95"/><stop offset=".5" stop-color="#9b72ff" stop-opacity=".42"/><stop offset="1" stop-color="#6d5cff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="512" cy="520" r="278" fill="url(#core)" opacity=".72"/>
